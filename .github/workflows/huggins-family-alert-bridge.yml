name: Huggins Family Alert Bridge

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert branch
        uses: actions/checkout@v4
        with:
          ref: discord-alert-router-v1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bridge dependencies
        working-directory: discord-alert-router
        run: npm install

      - name: Run family alert bridge
        working-directory: discord-alert-router
        env:
          ROUTER_URL: https://huggins-discord-alert-router.onrender.com
          BRIDGE_TOKEN: ${{ secrets.HUGGINS_BRIDGE_TOKEN }}
          CALENDAR_ICAL_URLS: ${{ secrets.HUGGINS_CALENDAR_ICAL_URLS }}
          TODOIST_API_TOKEN: ${{ secrets.HUGGINS_TODOIST_API_TOKEN }}
          TODOIST_PROJECT_IDS: 6hggmfpRwXGPFjc4,6hggmfqwH4wMq9QJ,6hgh4GQqx93H4qjr
          FAMILY_TIMEZONE: America/New_York
        run: node bridge.js
